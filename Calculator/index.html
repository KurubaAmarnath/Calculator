<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="display" id="display">0</div>

  <div class="row">
    <div class="square" data-value="AC">AC</div>
    <div class="square1" data-value="()">()</div>
    <div class="square2" data-value="%">%</div>
    <div class="square3" data-value="/">÷</div>
  </div>

  <div class="row">
    <div class="square4" data-value="7">7</div>
    <div class="square5" data-value="8">8</div>
    <div class="square6" data-value="9">9</div>
    <div class="square7" data-value="×">×</div>
  </div>

  <div class="row">
    <div class="square8" data-value="4">4</div>
    <div class="square9" data-value="5">5</div>
    <div class="square10" data-value="6">6</div>
    <div class="square11" data-value="-">-</div>
  </div>

  <div class="row">
    <div class="square12" data-value="1">1</div>
    <div class="square13" data-value="2">2</div>
    <div class="square14" data-value="3">3</div>
    <div class="square15" data-value="+">+</div>
  </div>

  <div class="row">
    <div class="square16" data-value="0">0</div>
    <div class="square17" data-value=".">.</div>
    <div class="square18" data-value="clear">←</div>
    <div class="square19" data-value="=">=</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
